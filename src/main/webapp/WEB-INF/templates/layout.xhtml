<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title><ui:insert name="title">Gestion de Projet</ui:insert></title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link href="#{request.contextPath}/css/style.css" rel="stylesheet" />
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; color: #333; }
        .sidebar { min-height: 100vh; background: #2c3e50; color: #ecf0f1; padding-top: 20px; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 10px 20px; display: block; font-weight: 500; transition: background 0.2s; }
        .sidebar a:hover { background: #34495e; border-left: 4px solid #3498db; }
        .sidebar .active { background: #34495e; border-left: 4px solid #3498db; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; color: #2c3e50 !important; }
        .main-content { padding: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #3498db; border: none; border-radius: 8px; padding: 8px 20px; font-weight: 500; }
        .btn-primary:hover { background-color: #2980b9; }
        .page-header { margin-bottom: 30px; padding-bottom: 10px; border-bottom: 2px solid #eef2f5; display: flex; justify-content: space-between; align-items: center; }
    </style>
</h:head>
<h:body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <div class="text-center mb-4">
                    <i class="fas fa-project-diagram fa-3x mb-2 text-info"></i>
                    <h5 class="fw-bold">TaskMaster Pro</h5>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="#{request.contextPath}/index.xhtml" class="nav-link"><i class="fas fa-home me-2"></i> Tableau de bord</a>
                    </li>
                    <li class="nav-item">
                        <a href="#{request.contextPath}/index.xhtml" class="nav-link"><i class="fas fa-folder-open me-2"></i> Projets</a>
                    </li>
                </ul>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10">
                <!-- Top Navbar -->
                <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 py-3">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">
                            <ui:insert name="header">Tableau de bord</ui:insert>
                        </span>
                        <div class="d-flex align-items-center">
                            <div class="dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <img src="https://ui-avatars.com/api/?name=Admin+User&amp;background=3498db&amp;color=fff" class="rounded-circle" width="35" alt="User" />
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                    <li><a class="dropdown-item" href="#">Profil</a></li>
                                    <li><a class="dropdown-item" href="#">Paramètres</a></li>
                                    <li><hr class="dropdown-divider" /></li>
                                    <li><a class="dropdown-item" href="#">Déconnexion</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </nav>

                <!-- Page Content -->
                <div class="main-content bg-light" style="min-height: calc(100vh - 76px);">
                    <ui:insert name="content">
                        Content goes here.
                    </ui:insert>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
